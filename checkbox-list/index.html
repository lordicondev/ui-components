<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Checkbox list</title>
        <link rel="stylesheet" href="./checkbox-list.css" />
        <script type="module" src="./main.ts"></script>
    </head>

    <body>
        <main class="demo">
            <fieldset class="options" id="style-box" data-page data-shape="box">
                <legend class="visually-hidden">Notifications</legend>

                <!-- A real checkbox, hidden but still what you click and submit.
                     data-checked exists so the icon can see the state. -->
                <label class="option" data-checked="false">
                    <input class="option__input visually-hidden" type="checkbox" name="email" />

                    <lord-icon
                        class="option__tick"
                        current-color
                        src="icons/check-box-empty.json"
                        loading="interaction"
                        trigger="follow(data-checked)"
                        target=".option"
                        state="morph-select"
                        aria-hidden="true"
                    >
                        <img alt="" src="icons/check-box-empty.svg" />
                    </lord-icon>

                    <span class="option__text">
                        <span class="option__title">Email marketing</span>
                        <span class="option__hint">
                            Receive product updates, tips, and special offers by email
                        </span>
                    </span>
                </label>

                <label class="option" data-checked="true">
                    <input
                        class="option__input visually-hidden"
                        type="checkbox"
                        name="sms"
                        checked
                    />

                    <lord-icon
                        class="option__tick"
                        current-color
                        src="icons/check-box-empty.json"
                        loading="interaction"
                        trigger="follow(data-checked)"
                        target=".option"
                        state="morph-select"
                        aria-hidden="true"
                    >
                        <img alt="" src="icons/check-box-empty.morph-select.svg" />
                    </lord-icon>

                    <span class="option__text">
                        <span class="option__title">SMS notifications</span>
                        <span class="option__hint">
                            Get order and delivery updates via text message
                        </span>
                    </span>
                </label>

                <label class="option" data-checked="true">
                    <input
                        class="option__input visually-hidden"
                        type="checkbox"
                        name="ads"
                        checked
                    />

                    <lord-icon
                        class="option__tick"
                        current-color
                        src="icons/check-box-empty.json"
                        loading="interaction"
                        trigger="follow(data-checked)"
                        target=".option"
                        state="morph-select"
                        aria-hidden="true"
                    >
                        <img alt="" src="icons/check-box-empty.morph-select.svg" />
                    </lord-icon>

                    <span class="option__text">
                        <span class="option__title">Personalized ads</span>
                        <span class="option__hint">
                            Let us use your activity to show more relevant ads
                        </span>
                    </span>
                </label>
            </fieldset>

            <fieldset class="options" id="style-circle" data-page data-shape="circle" hidden>
                <legend class="visually-hidden">Notifications</legend>

                <label class="option" data-checked="false">
                    <input class="option__input visually-hidden" type="checkbox" name="email" />

                    <lord-icon
                        class="option__tick"
                        current-color
                        src="icons/check-circle-empty.json"
                        trigger="follow(data-checked)"
                        target=".option"
                        state="morph-select"
                        aria-hidden="true"
                    ></lord-icon>

                    <span class="option__text">
                        <span class="option__title">Email marketing</span>
                        <span class="option__hint">
                            Receive product updates, tips, and special offers by email
                        </span>
                    </span>
                </label>

                <label class="option" data-checked="true">
                    <input
                        class="option__input visually-hidden"
                        type="checkbox"
                        name="sms"
                        checked
                    />

                    <lord-icon
                        class="option__tick"
                        current-color
                        src="icons/check-circle-empty.json"
                        trigger="follow(data-checked)"
                        target=".option"
                        state="morph-select"
                        aria-hidden="true"
                    ></lord-icon>

                    <span class="option__text">
                        <span class="option__title">SMS notifications</span>
                        <span class="option__hint">
                            Get order and delivery updates via text message
                        </span>
                    </span>
                </label>

                <label class="option" data-checked="true">
                    <input
                        class="option__input visually-hidden"
                        type="checkbox"
                        name="ads"
                        checked
                    />

                    <lord-icon
                        class="option__tick"
                        current-color
                        src="icons/check-circle-empty.json"
                        trigger="follow(data-checked)"
                        target=".option"
                        state="morph-select"
                        aria-hidden="true"
                    ></lord-icon>

                    <span class="option__text">
                        <span class="option__title">Personalized ads</span>
                        <span class="option__hint">
                            Let us use your activity to show more relevant ads
                        </span>
                    </span>
                </label>
            </fieldset>

            <fieldset class="options" id="style-single" data-page data-shape="circle" hidden>
                <legend class="visually-hidden">Preferred channel</legend>

                <label class="option" data-checked="false">
                    <input
                        class="option__input visually-hidden"
                        type="radio"
                        name="channel"
                        value="on"
                    />

                    <lord-icon
                        class="option__tick"
                        current-color
                        src="icons/radio-button.json"
                        trigger="follow(data-checked)"
                        target=".option"
                        state="morph-select"
                        aria-hidden="true"
                    ></lord-icon>

                    <span class="option__text">
                        <span class="option__title">Email marketing</span>
                        <span class="option__hint">
                            Receive product updates, tips, and special offers by email
                        </span>
                    </span>
                </label>

                <label class="option" data-checked="true">
                    <input
                        class="option__input visually-hidden"
                        type="radio"
                        name="channel"
                        value="on"
                        checked
                    />

                    <lord-icon
                        class="option__tick"
                        current-color
                        src="icons/radio-button.json"
                        trigger="follow(data-checked)"
                        target=".option"
                        state="morph-select"
                        aria-hidden="true"
                    ></lord-icon>

                    <span class="option__text">
                        <span class="option__title">SMS notifications</span>
                        <span class="option__hint">
                            Get order and delivery updates via text message
                        </span>
                    </span>
                </label>

                <label class="option" data-checked="false">
                    <input
                        class="option__input visually-hidden"
                        type="radio"
                        name="channel"
                        value="on"
                    />

                    <lord-icon
                        class="option__tick"
                        current-color
                        src="icons/radio-button.json"
                        trigger="follow(data-checked)"
                        target=".option"
                        state="morph-select"
                        aria-hidden="true"
                    ></lord-icon>

                    <span class="option__text">
                        <span class="option__title">Personalized ads</span>
                        <span class="option__hint">
                            Let us use your activity to show more relevant ads
                        </span>
                    </span>
                </label>
            </fieldset>

            <div class="pager">
                <button
                    class="pager__dot"
                    type="button"
                    aria-pressed="true"
                    aria-controls="style-box"
                    aria-label="Square checkboxes"
                ></button>
                <button
                    class="pager__dot"
                    type="button"
                    aria-pressed="false"
                    aria-controls="style-circle"
                    aria-label="Round checkboxes"
                ></button>
                <button
                    class="pager__dot"
                    type="button"
                    aria-pressed="false"
                    aria-controls="style-single"
                    aria-label="Single choice"
                ></button>
            </div>
        </main>
    </body>
</html>
