<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Dropdown menu</title>
        <link rel="stylesheet" href="./dropdown-menu.css" />
        <script type="module" src="./main.ts"></script>
    </head>
    <body>
        <main class="demo">
            <!-- The whole of what opens the menu is `popovertarget`. Which way it opens is
                 not said here and could not be: `popovers()` measures the room around the
                 button, so the same markup near the foot of a window opens upward. -->
            <button class="dots" type="button" popovertarget="edit" aria-label="More options">
                <lord-icon
                    class="dots__mark current-color"
                    src="icons/three-dots-vertical.json"
                    trigger="hover-focus"
                    target=".dots"
                    aria-hidden="true"
                ></lord-icon>
            </button>

            <!-- #region menu -->
            <!-- `role="menu"` with `tabindex="-1"` on the rows is one tab stop rather than
                 five, which is what a menu is. `data-keys` says this is the element the arrow
                 keys talk to, and `data-choose` marks a row as an answer — popover.ts closes
                 the menu on one, menus.ts walks between them, off the one attribute. -->
            <div class="menu popover" id="edit" popover role="menu" tabindex="-1" data-keys>
                <div class="menu__group" role="group" aria-labelledby="edit-heading">
                    <p class="menu__heading" data-rise id="edit-heading">Edit</p>
                    <div class="menu__list">
                        <!-- prettier-ignore -->
                        <button class="row" type="button" role="menuitem" tabindex="-1" data-choose data-rise>
                            <lord-icon
                                class="row__icon current-color"
                                src="icons/pencil-line.json"
                                trigger="active-attention"
                                target=".row"
                                aria-hidden="true"
                            ></lord-icon>
                            <span class="row__label" data-reveal>Rename</span>
                        </button>
                        <!-- #skip -->
                        <!-- prettier-ignore -->
                        <button class="row" type="button" role="menuitem" tabindex="-1" data-choose data-rise>
                            <lord-icon
                                class="row__icon current-color"
                                src="icons/copy.json"
                                trigger="active-attention"
                                target=".row"
                                aria-hidden="true"
                            ></lord-icon>
                            <span class="row__label" data-reveal>Duplicate</span>
                        </button>
                        <!-- #endskip -->
                    </div>
                </div>
                <!-- #skip -->

                <div class="menu__group" role="group" aria-labelledby="share-heading">
                    <p class="menu__heading" data-rise id="share-heading">Share</p>
                    <div class="menu__list">
                        <!-- prettier-ignore -->
                        <button class="row" type="button" role="menuitem" tabindex="-1" data-choose data-rise>
                            <lord-icon
                                class="row__icon current-color"
                                src="icons/link.json"
                                trigger="active-attention"
                                target=".row"
                                aria-hidden="true"
                            ></lord-icon>
                            <span class="row__label" data-reveal>Copy link</span>
                        </button>
                        <!-- prettier-ignore -->
                        <button class="row" type="button" role="menuitem" tabindex="-1" data-choose data-rise>
                            <lord-icon
                                class="row__icon current-color"
                                src="icons/avatars-group.json"
                                trigger="active-attention"
                                target=".row"
                                aria-hidden="true"
                            ></lord-icon>
                            <span class="row__label" data-reveal>Share with Team</span>
                        </button>
                    </div>
                </div>

                <!-- No heading over the last one, because what it does belongs to no group:
                     it is the one thing on this menu you cannot undo. `data-danger` is the
                     whole of saying so — the stylesheet does the rest in one declaration. -->
                <div class="menu__list">
                    <!-- prettier-ignore -->
                    <button class="row" type="button" role="menuitem" tabindex="-1" data-choose data-rise data-danger>
                        <lord-icon
                            class="row__icon current-color"
                            src="icons/trash-bin.json"
                            trigger="active-attention"
                            target=".row"
                            aria-hidden="true"
                        ></lord-icon>
                        <span class="row__label" data-reveal>Delete</span>
                    </button>
                </div>
                <!-- #endskip -->
            </div>
            <!-- #endregion -->
        </main>
    </body>
</html>
