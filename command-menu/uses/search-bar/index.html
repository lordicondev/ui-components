<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Search bar</title>
        <link rel="stylesheet" href="./search-bar.css" />
        <script type="module" src="./main.ts"></script>
    </head>
    <body>
        <main class="demo">
            <form class="search" role="search">
                <!-- #region markup -->
                <!-- Two attributes, and between them the whole control. `data-focused` is
                     whether the cursor is in the field; `data-clearable` is whether there
                     is anything worth offering to clear. Each icon follows one of them,
                     and the stylesheet follows both. -->
                <div class="field" data-focused="false" data-clearable="false">
                    <label class="visually-hidden" for="q">Search</label>

                    <lord-icon
                        class="field__mark current-color"
                        src="icons/magnifier.json"
                        trigger="focus-attention"
                        target=".field"
                        aria-hidden="true"
                    ></lord-icon>

                    <input class="field__input" id="q" type="search" placeholder="Search" />
                    <!-- #skip -->
                    <!-- #region clear -->
                    <!-- `state` is an entrance, which is why the cross draws itself rather
                         than appearing: `in-reveal` starts from an empty frame. Nothing
                         hides this button — `data-clearable` does, in the stylesheet, and
                         the same attribute is what tells the icon to draw. -->
                    <button class="field__clear" type="button" aria-label="Clear search">
                        <lord-icon
                            class="field__mark current-color"
                            src="icons/cross.json"
                            trigger="clearable-attention"
                            target=".field"
                            state="in-reveal"
                            aria-hidden="true"
                        ></lord-icon>
                    </button>
                    <!-- #endregion -->
                    <!-- #endskip -->
                </div>
                <!-- #endregion -->
            </form>
        </main>
    </body>
</html>
