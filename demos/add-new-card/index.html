<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Add new card</title>
        <link rel="stylesheet" href="./add-new-card.css" />
        <script type="module" src="./main.ts"></script>
    </head>
    <body>
        <main class="demo">
            <!-- #region markup -->
            <!-- target points the icon at the tile, so the plus turns when the pointer
                 reaches any part of it. hover is a built-in trigger. -->
            <button class="tile" type="button">
                <span class="tile__puck">
                    <lord-icon
                        class="tile__mark"
                        current-color
                        src="icons/plus.json"
                        loading="interaction"
                        trigger="hover"
                        target=".tile"
                        state="hover-rotation"
                        aria-hidden="true"
                    >
                        <img alt="" src="icons/plus.svg" />
                    </lord-icon>
                </span>

                <span class="tile__label">Add new card</span>
            </button>
            <!-- #endregion -->
        </main>
    </body>
</html>
