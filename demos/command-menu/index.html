<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Command menu</title>
        <link rel="stylesheet" href="./command-menu.css" />
        <script type="module" src="./main.ts"></script>
    </head>
    <body>
        <main class="demo">
            <!-- aria-keyshortcuts announces the shortcut that main.ts listens for. -->
            <button
                class="opener"
                type="button"
                popovertarget="palette"
                aria-keyshortcuts="Meta+K Control+K"
            >
                Open menu (⌘K)
            </button>

            <div class="menu popover" id="palette" popover>
                <!-- #region field -->
                <!-- The search bar's field, plus data-keys: the arrow keys move a cursor
                     down the list while the caret stays in the input. -->
                <div class="field" data-focused="false" data-clearable="false" data-rise>
                    <label class="visually-hidden" for="command">Command</label>
                    <lord-icon
                        class="field__mark"
                        current-color
                        src="icons/magnifier.json"
                        trigger="follow(data-focused)"
                        target=".field"
                        aria-hidden="true"
                    ></lord-icon>
                    <!-- prettier-ignore -->
                    <input class="field__input" id="command" type="search" role="combobox"
                           placeholder="Type a command or search..." autocomplete="off"
                           aria-controls="commands" aria-expanded="true" data-keys />
                    <!-- #skip -->
                    <button class="field__clear" type="button" aria-label="Clear">
                        <lord-icon
                            class="field__mark"
                            current-color
                            src="icons/cross.json"
                            trigger="follow(data-clearable)"
                            target=".field"
                            state="in-reveal"
                            aria-hidden="true"
                        ></lord-icon>
                    </button>
                    <!-- #endskip -->
                </div>
                <!-- #endregion -->

                <!-- #region palette -->
                <div class="commands" id="commands" role="listbox" aria-label="Commands">
                    <div class="menu__group" role="group" aria-labelledby="suggest-heading">
                        <p class="menu__heading" data-rise id="suggest-heading">Suggestions</p>
                        <div class="menu__list">
                            <!-- prettier-ignore -->
                            <div class="row" role="option" aria-selected="false" data-choose data-rise>
                                <lord-icon
                                    class="row__icon"
                                    current-color
                                    src="icons/file-text.json"
                                    trigger="follow(data-active)"
                                    target=".row"
                                    aria-hidden="true"
                                ></lord-icon>
                                <span class="row__label" data-reveal>Create new document</span>
                            </div>
                            <!-- #skip -->
                            <!-- prettier-ignore -->
                            <div class="row" role="option" aria-selected="false" data-choose data-rise>
                                <lord-icon
                                    class="row__icon"
                                    current-color
                                    src="icons/clock-arrow-rotate-left.json"
                                    trigger="follow(data-active)"
                                    target=".row"
                                    aria-hidden="true"
                                ></lord-icon>
                                <span class="row__label" data-reveal>Open recent file</span>
                            </div>
                            <!-- #endskip -->
                        </div>
                    </div>
                    <!-- #skip -->

                    <div class="menu__group" role="group" aria-labelledby="actions-heading">
                        <p class="menu__heading" data-rise id="actions-heading">Actions</p>
                        <div class="menu__list">
                            <!-- prettier-ignore -->
                            <div class="row" role="option" aria-selected="false" data-choose data-rise>
                                <lord-icon
                                    class="row__icon"
                                    current-color
                                    src="icons/link.json"
                                    trigger="follow(data-active)"
                                    target=".row"
                                    aria-hidden="true"
                                ></lord-icon>
                                <span class="row__label" data-reveal>Copy link</span>
                            </div>
                            <!-- prettier-ignore -->
                            <div class="row" role="option" aria-selected="false" data-choose data-rise>
                                <lord-icon
                                    class="row__icon"
                                    current-color
                                    src="icons/copy.json"
                                    trigger="follow(data-active)"
                                    target=".row"
                                    aria-hidden="true"
                                ></lord-icon>
                                <span class="row__label" data-reveal>Duplicate</span>
                            </div>
                            <!-- prettier-ignore -->
                            <div class="row" role="option" aria-selected="false" data-choose data-rise>
                                <lord-icon
                                    class="row__icon"
                                    current-color
                                    src="icons/trash-bin.json"
                                    trigger="follow(data-active)"
                                    target=".row"
                                    aria-hidden="true"
                                ></lord-icon>
                                <span class="row__label" data-reveal>Delete</span>
                            </div>
                        </div>
                    </div>

                    <div class="menu__group" role="group" aria-labelledby="navigate-heading">
                        <p class="menu__heading" data-rise id="navigate-heading">Navigation</p>
                        <div class="menu__list">
                            <!-- prettier-ignore -->
                            <div class="row" role="option" aria-selected="false" data-choose data-rise>
                                <lord-icon
                                    class="row__icon"
                                    current-color
                                    src="icons/cog.json"
                                    trigger="follow(data-active)"
                                    target=".row"
                                    aria-hidden="true"
                                ></lord-icon>
                                <span class="row__label" data-reveal>Open settings</span>
                            </div>
                            <!-- prettier-ignore -->
                            <div class="row" role="option" aria-selected="false" data-choose data-rise>
                                <lord-icon
                                    class="row__icon"
                                    current-color
                                    src="icons/avatar-circle.json"
                                    trigger="follow(data-active)"
                                    target=".row"
                                    aria-hidden="true"
                                ></lord-icon>
                                <span class="row__label" data-reveal>View profile</span>
                            </div>
                        </div>
                    </div>
                    <!-- #endskip -->
                </div>
                <!-- #endregion -->

                <!-- Shown when nothing matches. hidden for the layout, data-shown for the
                     icon, which cannot animate out of display: none. -->
                <p class="empty" data-shown="false" hidden>
                    <lord-icon
                        class="empty__mark"
                        current-color
                        src="icons/cross-circle.json"
                        trigger="follow(data-shown)"
                        target=".empty"
                        state="in-reveal"
                        aria-hidden="true"
                    ></lord-icon>
                    No results found.
                </p>
            </div>
        </main>
    </body>
</html>
