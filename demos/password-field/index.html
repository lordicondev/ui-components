<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Password field</title>
        <link rel="stylesheet" href="./password-field.css" />
        <script type="module" src="./main.ts"></script>
    </head>
    <body>
        <main class="demo">
            <form class="demo__form" novalidate>
                <!-- #region markup -->
                <!-- target names the ancestor whose state the icon follows; the element
                     resolves it with closest(). Here it is .field. -->
                <div class="field" aria-invalid="false" data-focused="false">
                    <label class="field__label" for="password">Password</label>

                    <div class="field__control">
                        <lord-icon
                            class="field__icon field__lock"
                            current-color
                            src="icons/lock.json"
                            loading="interaction"
                            trigger="follow(data-focused)"
                            target=".field"
                            aria-hidden="true"
                        >
                            <img alt="" src="icons/lock.svg" />
                        </lord-icon>

                        <input
                            class="field__input"
                            id="password"
                            type="password"
                            value="hunter2"
                            minlength="8"
                            required
                            aria-describedby="password-error"
                        />
                        <!-- #skip -->

                        <!-- #region toggle -->
                        <button
                            class="field__toggle"
                            type="button"
                            aria-label="Show password"
                            aria-pressed="false"
                        >
                            <!-- state picks the morph: first half to reveal, second to hide. -->
                            <lord-icon
                                class="field__icon"
                                current-color
                                src="icons/eye.json"
                                loading="interaction"
                                trigger="follow(aria-pressed)"
                                target=".field__toggle"
                                state="morph-close"
                                aria-hidden="true"
                            >
                                <img alt="" src="icons/eye.svg" />
                            </lord-icon>
                        </button>
                        <!-- #endregion -->
                        <!-- #endskip -->
                    </div>
                    <!-- #skip -->

                    <p class="field__error" id="password-error" data-raised="0" hidden>
                        <!-- #region hint -->
                        <!-- data-raised counts how many times the message has been shown:
                             the icon draws itself in on the first, and nudges on a repeat. -->
                        <lord-icon
                            class="field__error-icon"
                            current-color
                            src="icons/warning-circle.json"
                            trigger="follow(data-raised)"
                            target=".field__error"
                            state="in-reveal"
                            aria-hidden="true"
                        ></lord-icon>
                        <!-- #endregion -->
                        <span class="field__error-text">Must be at least 8 characters</span>
                    </p>
                    <!-- #endskip -->
                </div>
                <!-- #endregion -->

                <button class="demo__submit" type="submit">Sign in</button>
            </form>
        </main>
    </body>
</html>
