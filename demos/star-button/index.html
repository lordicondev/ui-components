<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Star button</title>
        <link rel="stylesheet" href="./star-button.css" />
        <script type="module" src="./main.ts"></script>
    </head>
    <body>
        <main class="demo">
            <!-- #region markup -->
            <!-- aria-pressed is the whole state. The icon reads it through `target`, the
                 stylesheet colours by it, the count is derived from it. The hidden word
                 makes the button read as "24 stars". -->
            <button class="star" type="button" aria-pressed="false">
                <lord-icon
                    class="star__mark"
                    current-color
                    src="icons/star.json"
                    loading="interaction"
                    trigger="follow(aria-pressed)"
                    target=".star"
                    state="morph-select"
                    aria-hidden="true"
                >
                    <img alt="" src="icons/star.svg" />
                </lord-icon>

                <span class="star__count">24</span>
                <span class="visually-hidden">stars</span>
            </button>
            <!-- #endregion -->
        </main>
    </body>
</html>
