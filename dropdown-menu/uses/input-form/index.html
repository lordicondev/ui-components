<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Input form</title>
        <link rel="stylesheet" href="./input-form.css" />
        <script type="module" src="./main.ts"></script>
    </head>
    <body>
        <main class="demo">
            <!-- #region composer -->
            <!-- The control, and the whole of what opens the menu: `popovertarget`. Which
                 way it opens is not said here — the composer sits at the foot of the page,
                 and `popovers()` finds that out for itself. -->
            <form class="composer">
                <label class="visually-hidden" for="prompt">Message</label>
                <!-- prettier-ignore -->
                <input class="composer__input" id="prompt" type="text"
                       placeholder="What's on your mind?" autocomplete="off" />

                <div class="composer__tools">
                    <button
                        class="plus"
                        type="button"
                        popovertarget="more"
                        aria-label="Add context"
                    >
                        <lord-icon
                            class="plus__mark current-color"
                            src="icons/plus.json"
                            trigger="hover-focus"
                            target=".plus"
                            aria-hidden="true"
                        ></lord-icon>
                    </button>
                    <!-- #skip -->
                    <div class="composer__say">
                        <button class="mic" type="button" aria-label="Dictate">
                            <lord-icon
                                class="tool__mark current-color"
                                src="icons/microphone.json"
                                trigger="hover-focus"
                                target=".mic"
                                aria-hidden="true"
                            ></lord-icon>
                        </button>

                        <button class="send" type="submit" aria-label="Send">
                            <lord-icon
                                class="tool__mark current-color"
                                src="icons/arrow-up.json"
                                trigger="hover-focus"
                                target=".send"
                                aria-hidden="true"
                            ></lord-icon>
                        </button>
                    </div>
                    <!-- #endskip -->
                </div>
            </form>
            <!-- #endregion -->

            <!-- The submenu lives inside this one, which is what makes them a pair as far
                 as the browser is concerned: an auto popover nested in another does not
                 dismiss it, and closing the outer takes the inner with it. It is in the top
                 layer either way, so being a child here costs it nothing in the layout. -->
            <div class="menu popover" id="more" popover>
                <ul class="menu__list">
                    <li class="menu__row" data-rise>
                        <button class="row" type="button" data-choose>
                            <lord-icon
                                class="row__icon current-color"
                                src="icons/link.json"
                                trigger="hover-focus"
                                target=".row"
                                aria-hidden="true"
                            ></lord-icon>
                            <span class="row__label" data-reveal>Add files or photos</span>
                        </button>
                    </li>

                    <!-- #region row -->
                    <!-- The row that opens the other panel, and the only one with no
                         `data-choose` on it: choosing puts the menus away, and this row is a
                         route rather than an answer. `popovertargetaction="show"` rather than
                         the default toggle, too — the pointer resting here is what opens the
                         panel, and a click that closed one you were still inside would be a
                         fight between the two. -->
                    <li class="menu__row" data-rise>
                        <button
                            class="row"
                            type="button"
                            popovertarget="projects"
                            popovertargetaction="show"
                        >
                            <lord-icon
                                class="row__icon current-color"
                                src="icons/folder.json"
                                trigger="hover-focus"
                                target=".row"
                                aria-hidden="true"
                            ></lord-icon>
                            <span class="row__label" data-reveal>Add to project</span>
                            <!-- The second icon, answering the same hover: `target=".row"`
                                 points both at the button rather than at themselves. -->
                            <lord-icon
                                class="row__more current-color"
                                src="icons/chevron-right.json"
                                trigger="hover-focus"
                                target=".row"
                                aria-hidden="true"
                            ></lord-icon>
                        </button>
                    </li>
                    <!-- #endregion -->

                    <li class="menu__row" data-rise>
                        <button class="row" type="button" data-choose>
                            <lord-icon
                                class="row__icon current-color"
                                src="icons/bulb.json"
                                trigger="hover-focus"
                                target=".row"
                                aria-hidden="true"
                            ></lord-icon>
                            <span class="row__label" data-reveal>Skills</span>
                        </button>
                    </li>

                    <li class="menu__row" data-rise>
                        <button class="row" type="button" data-choose>
                            <lord-icon
                                class="row__icon current-color"
                                src="icons/plug.json"
                                trigger="hover-focus"
                                target=".row"
                                aria-hidden="true"
                            ></lord-icon>
                            <span class="row__label" data-reveal>Add plugins</span>
                        </button>
                    </li>
                </ul>

                <div class="menu submenu popover" id="projects" popover data-side="inline">
                    <div class="field" data-focused="false" data-rise>
                        <label class="visually-hidden" for="project">Search projects</label>

                        <lord-icon
                            class="field__mark current-color"
                            src="icons/magnifier.json"
                            trigger="focus-attention"
                            target=".field"
                            aria-hidden="true"
                        ></lord-icon>

                        <input
                            class="field__input"
                            id="project"
                            type="search"
                            placeholder="Search projects"
                        />

                        <button class="field__clear" type="button" aria-label="Clear search">
                            <lord-icon
                                class="field__mark current-color"
                                src="icons/cross.json"
                                trigger="clearable-attention"
                                target=".field"
                                state="in-reveal"
                                aria-hidden="true"
                            ></lord-icon>
                        </button>
                    </div>

                    <ul class="projects">
                        <li class="projects__row" data-rise>
                            <button class="row" type="button" data-choose data-project="Gardening">
                                <lord-icon
                                    class="row__icon current-color"
                                    src="icons/folder.json"
                                    trigger="hover-focus"
                                    target=".row"
                                    aria-hidden="true"
                                ></lord-icon>
                                <span class="row__label" data-reveal>Gardening</span>
                            </button>
                        </li>

                        <li class="projects__row" data-rise>
                            <button
                                class="row"
                                type="button"
                                data-choose
                                data-project="Finance App"
                            >
                                <lord-icon
                                    class="row__icon current-color"
                                    src="icons/folder.json"
                                    trigger="hover-focus"
                                    target=".row"
                                    aria-hidden="true"
                                ></lord-icon>
                                <span class="row__label" data-reveal>Finance App</span>
                            </button>
                        </li>

                        <li class="projects__row" data-rise>
                            <button class="row" type="button" data-choose data-project="My wedding">
                                <lord-icon
                                    class="row__icon current-color"
                                    src="icons/folder.json"
                                    trigger="hover-focus"
                                    target=".row"
                                    aria-hidden="true"
                                ></lord-icon>
                                <span class="row__label" data-reveal>My wedding</span>
                            </button>
                        </li>
                    </ul>
                </div>
            </div>
        </main>
    </body>
</html>
