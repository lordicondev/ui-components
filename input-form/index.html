<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Input form</title>
        <link rel="stylesheet" href="./input-form.css" />
        <script type="module" src="./main.ts"></script>
    </head>
    <body>
        <main class="demo">
            <!-- popovertarget on the plus is what opens the menu. Which way it opens is
                 decided by popovers() from the room around the button. -->
            <form class="composer">
                <label class="visually-hidden" for="prompt">Message</label>
                <!-- prettier-ignore -->
                <input class="composer__input" id="prompt" type="text"
                       placeholder="What's on your mind?" autocomplete="off" />

                <div class="composer__tools">
                    <button
                        class="plus"
                        type="button"
                        popovertarget="more"
                        aria-label="Add context"
                    >
                        <lord-icon
                            class="plus__mark"
                            current-color
                            src="icons/system-outline-48-plus.json"
                            loading="interaction"
                            trigger="hover"
                            target=".plus"
                            aria-hidden="true"
                        >
                            <img alt="" src="icons/system-outline-48-plus.svg" />
                        </lord-icon>
                    </button>
                    <div class="composer__say">
                        <button class="mic" type="button" aria-label="Dictate">
                            <lord-icon
                                class="tool__mark"
                                current-color
                                src="icons/system-outline-188-microphone.json"
                                loading="interaction"
                                trigger="hover"
                                target=".mic"
                                aria-hidden="true"
                            >
                                <img alt="" src="icons/system-outline-188-microphone.svg" />
                            </lord-icon>
                        </button>

                        <button class="send" type="submit" aria-label="Send">
                            <lord-icon
                                class="tool__mark"
                                current-color
                                src="icons/system-outline-2754-arrow-up.json"
                                loading="interaction"
                                trigger="hover"
                                target=".send"
                                aria-hidden="true"
                            >
                                <img alt="" src="icons/system-outline-2754-arrow-up.svg" />
                            </lord-icon>
                        </button>
                    </div>
                </div>
            </form>

            <!-- The submenu is nested inside this panel, so the browser treats the two as
                 a pair: opening the inner does not dismiss the outer. -->
            <div class="menu popover" id="more" popover>
                <ul class="menu__list">
                    <li class="menu__row" data-rise>
                        <button class="row" type="button" data-choose>
                            <lord-icon
                                class="row__icon"
                                current-color
                                src="icons/system-outline-11-link.json"
                                trigger="hover"
                                target=".row"
                                aria-hidden="true"
                            ></lord-icon>
                            <span class="row__label" data-reveal>Add files or photos</span>
                        </button>
                    </li>

                    <!-- The row that opens the submenu. No data-choose, because choosing
                         closes the menus. popovertargetaction="show", not toggle: the pointer
                         already opens it, and a click must not close it again. -->
                    <li class="menu__row" data-rise>
                        <button
                            class="row"
                            type="button"
                            popovertarget="projects"
                            popovertargetaction="show"
                        >
                            <lord-icon
                                class="row__icon"
                                current-color
                                src="icons/system-outline-120-folder.json"
                                trigger="hover"
                                target=".row"
                                aria-hidden="true"
                            ></lord-icon>
                            <span class="row__label" data-reveal>Add to project</span>
                            <!-- Both icons target the row, so both play on the same hover. -->
                            <lord-icon
                                class="row__more"
                                current-color
                                src="icons/system-outline-31-chevron-right.json"
                                trigger="hover"
                                target=".row"
                                aria-hidden="true"
                            ></lord-icon>
                        </button>
                    </li>

                    <li class="menu__row" data-rise>
                        <button class="row" type="button" data-choose>
                            <lord-icon
                                class="row__icon"
                                current-color
                                src="icons/system-outline-36-bulb.json"
                                trigger="hover"
                                target=".row"
                                aria-hidden="true"
                            ></lord-icon>
                            <span class="row__label" data-reveal>Skills</span>
                        </button>
                    </li>

                    <li class="menu__row" data-rise>
                        <button class="row" type="button" data-choose>
                            <lord-icon
                                class="row__icon"
                                current-color
                                src="icons/system-outline-452-plug.json"
                                trigger="hover"
                                target=".row"
                                aria-hidden="true"
                            ></lord-icon>
                            <span class="row__label" data-reveal>Add plugins</span>
                        </button>
                    </li>
                </ul>

                <div class="menu submenu popover" id="projects" popover data-side="inline">
                    <div class="field" data-focused="false" data-clearable="false" data-rise>
                        <label class="visually-hidden" for="project">Search projects</label>

                        <lord-icon
                            class="field__mark"
                            current-color
                            src="icons/system-outline-19-magnifier.json"
                            trigger="follow(data-focused)"
                            target=".field"
                            aria-hidden="true"
                        ></lord-icon>

                        <input
                            class="field__input"
                            id="project"
                            type="search"
                            placeholder="Search projects"
                        />

                        <button class="field__clear" type="button" aria-label="Clear search">
                            <lord-icon
                                class="field__mark"
                                current-color
                                src="icons/system-outline-38-cross.json"
                                trigger="follow(data-clearable)"
                                target=".field"
                                state="in-reveal"
                                aria-hidden="true"
                            ></lord-icon>
                        </button>
                    </div>

                    <ul class="projects">
                        <li class="projects__row" data-rise>
                            <button class="row" type="button" data-choose>
                                <lord-icon
                                    class="row__icon"
                                    current-color
                                    src="icons/system-outline-120-folder.json"
                                    trigger="hover"
                                    target=".row"
                                    aria-hidden="true"
                                ></lord-icon>
                                <span class="row__label" data-reveal>Gardening</span>
                            </button>
                        </li>

                        <li class="projects__row" data-rise>
                            <button class="row" type="button" data-choose>
                                <lord-icon
                                    class="row__icon"
                                    current-color
                                    src="icons/system-outline-120-folder.json"
                                    trigger="hover"
                                    target=".row"
                                    aria-hidden="true"
                                ></lord-icon>
                                <span class="row__label" data-reveal>Finance App</span>
                            </button>
                        </li>

                        <li class="projects__row" data-rise>
                            <button class="row" type="button" data-choose>
                                <lord-icon
                                    class="row__icon"
                                    current-color
                                    src="icons/system-outline-120-folder.json"
                                    trigger="hover"
                                    target=".row"
                                    aria-hidden="true"
                                ></lord-icon>
                                <span class="row__label" data-reveal>My wedding</span>
                            </button>
                        </li>
                    </ul>
                </div>
            </div>
        </main>
    </body>
</html>
