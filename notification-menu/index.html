<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Notification menu</title>
        <link rel="stylesheet" href="./notification-menu.css" />
        <script type="module" src="./main.ts"></script>
    </head>
    <body>
        <main class="demo">
            <div class="stage">
                <!-- #region bell -->
                <!-- `popovertarget` is the whole of the opening: the browser toggles the
                     panel, closes it on a click away or on Escape, and says in the
                     accessibility tree what this button is for.

                     `data-count` is the notification count, and everything else reads it.
                     The icon rings when it goes up, the badge is drawn from it, and the
                     stylesheet draws the button pressed while `aria-expanded` is true —
                     which `popovers()` puts there off the browser's own toggle event. -->
                <button
                    class="bell"
                    type="button"
                    popovertarget="feed"
                    data-count="0"
                    aria-label="Notifications"
                >
                    <lord-icon
                        class="bell__mark current-color"
                        src="icons/bell.json"
                        trigger="count-attention"
                        target=".bell"
                        aria-hidden="true"
                    ></lord-icon>

                    <span class="bell__badge" aria-hidden="true" hidden></span>
                </button>
                <!-- #endregion -->

                <div class="menu popover" id="feed" popover>
                    <div class="menu__head" data-rise>
                        <h2 class="menu__title">Notification</h2>
                        <button class="menu__read" type="button">Mark as read</button>
                    </div>

                    <ul class="feed">
                        <!-- #region item -->
                        <!-- One notification. `data-unread` is both halves of what new
                             means: the dot beside it, and the tint behind it that unrolls
                             on the way in. `data-rise` marks the row as one of the things
                             the panel brings in, and `data-reveal` marks the words inside
                             it that arrive one after another. -->
                        <li class="feed__row" data-unread data-rise>
                            <button class="row" type="button">
                                <span class="row__mark">
                                    <lord-icon
                                        class="row__icon current-color"
                                        src="icons/heart.json"
                                        trigger="hover-focus"
                                        target=".row"
                                        aria-hidden="true"
                                    ></lord-icon>
                                </span>

                                <span class="row__body">
                                    <span class="row__title" data-reveal>
                                        Anna liked your Bell component
                                    </span>
                                    <span class="row__time">2 min ago</span>
                                </span>

                                <span class="row__dot" aria-hidden="true"></span>
                                <span class="row__unread">Unread</span>
                            </button>
                        </li>
                        <!-- #endregion -->

                        <li class="feed__row" data-unread data-rise>
                            <button class="row" type="button">
                                <span class="row__mark">
                                    <lord-icon
                                        class="row__icon current-color"
                                        src="icons/download.json"
                                        trigger="hover-focus"
                                        target=".row"
                                        aria-hidden="true"
                                    ></lord-icon>
                                </span>

                                <span class="row__body">
                                    <span class="row__title" data-reveal>
                                        Version 1.4.0 is now available
                                    </span>
                                    <span class="row__time">1 hour ago</span>
                                </span>

                                <span class="row__dot" aria-hidden="true"></span>
                                <span class="row__unread">Unread</span>
                            </button>
                        </li>

                        <li class="feed__row" data-rise>
                            <button class="row" type="button">
                                <span class="row__mark">
                                    <lord-icon
                                        class="row__icon current-color"
                                        src="icons/message.json"
                                        trigger="hover-focus"
                                        target=".row"
                                        aria-hidden="true"
                                    ></lord-icon>
                                </span>

                                <span class="row__body">
                                    <span class="row__title" data-reveal>
                                        Marek commented: “amazing job!”
                                    </span>
                                    <span class="row__time">yesterday</span>
                                </span>
                            </button>
                        </li>

                        <li class="feed__row" data-rise>
                            <button class="row" type="button">
                                <span class="row__mark">
                                    <lord-icon
                                        class="row__icon current-color"
                                        src="icons/star.json"
                                        trigger="hover-focus"
                                        target=".row"
                                        aria-hidden="true"
                                    ></lord-icon>
                                </span>

                                <span class="row__body">
                                    <span class="row__title" data-reveal>
                                        Your plugin just passed 500 stars
                                    </span>
                                    <span class="row__time">2 days ago</span>
                                </span>
                            </button>
                        </li>
                    </ul>
                </div>
            </div>

            <!-- Not part of the control. The count is an input to this demo, and these are
                 the only way to give it one from a page with nothing behind it. -->
            <form class="controls">
                <label class="controls__label" for="count">Notifications</label>
                <input
                    class="controls__input"
                    id="count"
                    type="number"
                    min="0"
                    max="99"
                    value="5"
                    inputmode="numeric"
                />
                <button class="controls__go" type="submit">Set</button>
            </form>
        </main>
    </body>
</html>
