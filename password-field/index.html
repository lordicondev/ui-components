<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Password field</title>
        <link rel="stylesheet" href="./password-field.css" />
        <script type="module" src="./main.ts"></script>
    </head>
    <body>
        <main class="demo">
            <form class="demo__form" novalidate>
                <!-- #region markup -->
                <!-- `target` names the element whose state the icon follows, and it has
                     to be an ancestor — the trigger resolves it with closest(). Here that
                     is .field, which carries aria-invalid for the whole control. -->
                <div class="field" aria-invalid="false">
                    <label class="field__label" for="password">Password</label>

                    <div class="field__control">
                        <lord-icon
                            class="field__icon field__lock current-color"
                            src="icons/lock.json"
                            trigger="invalid-attention"
                            target=".field"
                            aria-hidden="true"
                        ></lord-icon>

                        <input
                            class="field__input"
                            id="password"
                            type="password"
                            value="hunter2"
                            minlength="8"
                            required
                            aria-describedby="password-error"
                        />
                        <!-- #skip -->

                        <!-- #region toggle -->
                        <button
                            class="field__toggle"
                            type="button"
                            aria-label="Show password"
                            aria-pressed="false"
                        >
                            <!-- `state` picks the morph to use; the trigger plays its
                                 first half to reveal and its second to hide. -->
                            <lord-icon
                                class="field__icon current-color"
                                src="icons/eye.json"
                                trigger="pressed-morph"
                                target=".field__toggle"
                                state="morph-close"
                                aria-hidden="true"
                            ></lord-icon>
                        </button>
                        <!-- #endregion -->
                        <!-- #endskip -->
                    </div>
                    <!-- #skip -->

                    <p class="field__error" id="password-error" hidden>
                        <!-- #region built-in -->
                        <!-- A built-in trigger is enough here: the icon plays once, as the
                             message appears. No custom trigger, no JavaScript. -->
                        <lord-icon
                            class="field__error-icon current-color"
                            src="icons/warning-circle.json"
                            trigger="in"
                            aria-hidden="true"
                        ></lord-icon>
                        <!-- #endregion -->
                        Must be at least 8 characters
                    </p>
                    <!-- #endskip -->
                </div>
                <!-- #endregion -->

                <button class="demo__submit" type="submit">Sign in</button>
            </form>
        </main>
    </body>
</html>
