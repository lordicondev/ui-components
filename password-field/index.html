<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Password field</title>
        <link rel="stylesheet" href="./password-field.css" />
        <script type="module" src="./main.ts"></script>
    </head>
    <body>
        <main class="demo">
            <form class="demo__form" novalidate>
                <!-- target names the ancestor whose state the icon follows; the element
                     resolves it with closest(). Here it is .field. -->
                <div class="field" aria-invalid="false" data-focused="false">
                    <label class="field__label" for="password">Password</label>

                    <div class="field__control">
                        <lord-icon
                            class="field__icon field__lock current-color"
                            src="icons/lock.json"
                            trigger="focus-attention"
                            target=".field"
                            aria-hidden="true"
                        ></lord-icon>

                        <input
                            class="field__input"
                            id="password"
                            type="password"
                            value="hunter2"
                            minlength="8"
                            required
                            aria-describedby="password-error"
                        />

                        <button
                            class="field__toggle"
                            type="button"
                            aria-label="Show password"
                            aria-pressed="false"
                        >
                            <!-- state picks the morph: first half to reveal, second to hide. -->
                            <lord-icon
                                class="field__icon current-color"
                                src="icons/eye.json"
                                trigger="pressed-morph"
                                target=".field__toggle"
                                state="morph-close"
                                aria-hidden="true"
                            ></lord-icon>
                        </button>
                    </div>

                    <p class="field__error" id="password-error" data-raised="0" hidden>
                        <!-- data-raised counts how many times the message has been shown:
                             the icon draws itself in on the first, and nudges on a repeat. -->
                        <lord-icon
                            class="field__error-icon current-color"
                            src="icons/warning-circle.json"
                            trigger="raised-attention"
                            target=".field__error"
                            state="in-reveal"
                            aria-hidden="true"
                        ></lord-icon>
                        <span class="field__error-text">Must be at least 8 characters</span>
                    </p>
                </div>

                <button class="demo__submit" type="submit">Sign in</button>
            </form>
        </main>
    </body>
</html>
