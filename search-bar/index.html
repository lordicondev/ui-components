<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Search bar</title>
        <link rel="stylesheet" href="./search-bar.css" />
        <script type="module" src="./main.ts"></script>
    </head>
    <body>
        <main class="demo">
            <form class="search" role="search">
                <!-- data-focused: focus is in the field. data-clearable: there is text to
                     clear. Each icon follows one; the stylesheet follows both. -->
                <div class="field" data-focused="false" data-clearable="false">
                    <label class="visually-hidden" for="q">Search</label>

                    <lord-icon
                        class="field__mark current-color"
                        src="icons/magnifier.json"
                        trigger="focus-attention"
                        target=".field"
                        aria-hidden="true"
                    ></lord-icon>

                    <input class="field__input" id="q" type="search" placeholder="Search" />
                    <!-- in-reveal starts from an empty frame, so the cross draws itself in.
                         The stylesheet shows the button on the same attribute. -->
                    <button class="field__clear" type="button" aria-label="Clear search">
                        <lord-icon
                            class="field__mark current-color"
                            src="icons/cross.json"
                            trigger="clearable-attention"
                            target=".field"
                            state="in-reveal"
                            aria-hidden="true"
                        ></lord-icon>
                    </button>
                </div>
            </form>
        </main>
    </body>
</html>
