<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Simple button</title>
        <link rel="stylesheet" href="./simple-button.css" />
        <script type="module" src="./main.ts"></script>
    </head>
    <body>
        <main class="demo">
            <!-- target points the icon at the button, so it plays wherever the pointer enters. -->
            <button class="button" type="button">
                <lord-icon
                    class="button__icon"
                    current-color
                    src="icons/system-outline-140-phone.json"
                    loading="interaction"
                    trigger="hover"
                    target=".button"
                    aria-hidden="true"
                >
                    <img alt="" src="icons/system-outline-140-phone.svg" />
                </lord-icon>
                Call us
            </button>
        </main>
    </body>
</html>
